<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Module B — world (town + rooms)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
  canvas { display: block; }
  .lbl { position: absolute; color: #fff; font: 800 12px/1.1 system-ui, sans-serif; text-shadow: 0 1px 2px #000, 0 0 4px #000;
         pointer-events: none; white-space: nowrap; padding: 3px 5px; background: rgba(0,0,0,.35); border-radius: 3px; }
  #stats { position: absolute; left: 6px; bottom: 6px; color: #fff; font: 600 11px/1.3 monospace; text-shadow: 0 1px 2px #000; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stats"></div>
<script type="module">
// Dev page for src/world.js
//   ?view=<name>   one view at full size. Names: overview_party street pool foam square_dusk quiet_street park_day
//                  room_night room_marcus room_grandad  (+ extras: room_brenda room_day room_dawn stage banner stands
//                  park_night myhouse square_night street_day anchors_square anchors_park anchors_room crowdB)
//   (no view)      contact sheet of the 12 main views (sheet=all → every view)
//   &t=1.5         time passed to set.update(t)
//   &anchors=1     2-unit test boxes (with a nose pointing +Z) at square.chairA/B, room.chair, park.stool1/2
//   &chars=1       real seated characters from /src/characters.js at those anchors (if that module loads)
//   &bench=10      render the view 10× at 720×1280 and print ms/frame + draw calls
import * as THREE from 'three';
import { buildTown, buildRoom } from '/src/world.js';

const Q = new URLSearchParams(location.search);
const VIEW = Q.get('view');
const T = parseFloat(Q.get('t') ?? '1.3');
const SHOW_ANCHORS = Q.get('anchors') === '1' || (VIEW || '').startsWith('anchors');
const CHARS = Q.get('chars') === '1';
const BENCH = parseInt(Q.get('bench') || '0', 10);
const W = window.innerWidth, H = window.innerHeight;

const EXP = (Q.get('exp') || '').split(',');
const renderer = new THREE.WebGLRenderer({ antialias: !EXP.includes('noaa'), preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 9 / 16, 0.1, 1000);
scene.add(camera);

// ── sets (built lazily, cached)
const cache = {};
const sets = {
  town: () => buildTown({ seed: 3 }),
  room: () => buildRoom({ variant: 'hero', poster: 'knight', window: 'party' }),
  roomMarcus: () => buildRoom({ variant: 'marcus', window: 'dark' }),
  roomBrenda: () => buildRoom({ variant: 'brenda', window: 'dark' }),
  roomGrandad: () => buildRoom({ variant: 'grandad', window: 'dark' }),
};
const getSet = (n) => (cache[n] ??= sets[n]());
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const P = (s, name, off = [0, 0, 0]) => { const a = s.anchors[name]; a.updateWorldMatrix(true, false); return a.localToWorld(V(...off)); };

// ── views: { set, lighting, opts, cam(set) → {pos, look, fov} }
const TOWN_DEFAULT = { partyProps: true, foam: 0, windowGlow: 1, fireworks: false, standsCrowd: 'auto', crowdMotion: 1 };
const VIEWS = {
  overview_party: { set: 'town', lighting: 'party_night', opts: { fireworks: true }, cam: () => ({ pos: V(-60, 31, 25), look: V(4, 0, -7), fov: 50 }) },
  street: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'street.crowdA', [1.0, 2.3, 7.5]), look: P(s, 'street.crowdA', [0, 1.9, -2]), fov: 46 }) },
  crowdB: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'street.crowdB', [-1, 2.2, 7.5]), look: P(s, 'street.crowdB', [0, 1.5, 0]), fov: 45 }) },
  pool: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'pool.cam'), look: P(s, 'pool.center', [0, 0.6, 0]), fov: 46 }) },
  foam: { set: 'town', lighting: 'party_night', opts: { foam: 1 }, cam: (s) => ({ pos: P(s, 'foam.cam'), look: P(s, 'foam.center', [0, 0.9, 0]), fov: 48 }) },
  square_dusk: { set: 'town', lighting: 'dusk', opts: {}, cam: (s) => ({ pos: P(s, 'square.cam1'), look: P(s, 'square.table', [0, 1.2, 0]), fov: 46 }) },
  square_night: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'square.cam1'), look: P(s, 'square.table', [0, 1.2, 0]), fov: 46 }) },
  stage: { set: 'town', lighting: 'dusk', opts: {}, cam: (s) => ({ pos: P(s, 'square.table', [-2.6, 0.9, 1.4]), look: P(s, 'square.table', [0, 0.1, 0]), fov: 44 }) },
  banner: { set: 'town', lighting: 'dusk', opts: {}, cam: (s) => ({ pos: P(s, 'square.bannerCam'), look: P(s, 'square.banner'), fov: 46 }) },
  stands: { set: 'town', lighting: 'dusk', opts: {}, cam: (s) => ({ pos: P(s, 'square.standA', [0, 2.4, 7.0]), look: P(s, 'square.standA', [0, 2.0, 0]), fov: 46 }) },
  quiet_street: { set: 'town', lighting: 'quiet_night', opts: { windowGlow: (h, w) => (((h * 3 + w * 5) % 7) < 2 ? 1 : 0.06) },
    cam: (s) => ({ pos: P(s, 'street.center', [-1.2, 2.2, 5.5]), look: P(s, 'street.center', [3, 3, -2]), fov: 52 }) },
  street_day: { set: 'town', lighting: 'day', opts: { partyProps: false }, cam: (s) => ({ pos: P(s, 'street.center', [0, 4.5, -9]), look: P(s, 'street.center', [0, 1.2, 4]), fov: 46 }) },
  park_day: { set: 'town', lighting: 'day', opts: { partyProps: false }, cam: (s) => ({ pos: P(s, 'park.cam'), look: P(s, 'park.table', [0, 0.2, 0]), fov: 46 }) },
  park_night: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'park.table', [0.4, 0.62, 2.6]), look: P(s, 'park.table', [0, -0.2, -0.6]), fov: 46 }) },
  myhouse: { set: 'town', lighting: 'party_night', opts: {}, cam: (s) => ({ pos: P(s, 'myHouse.window', [0.6, -2.2, 9]), look: P(s, 'myHouse.window', [0, -0.6, 0]), fov: 46 }) },
  room_night: { set: 'room', lighting: 'night', opts: { window: 'party' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  room_day: { set: 'room', lighting: 'day', opts: { window: 'day' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  room_dawn: { set: 'room', lighting: 'dawn', opts: { window: 'sunrise' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  room_marcus: { set: 'roomMarcus', lighting: 'night', opts: { window: 'dark' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  room_brenda: { set: 'roomBrenda', lighting: 'night', opts: { window: 'dark' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  room_grandad: { set: 'roomGrandad', lighting: 'night', opts: { window: 'dark' }, cam: (s) => ({ pos: P(s, 'room.cam'), look: P(s, 'room.center', [0, 1.05, 0]), fov: 46 }) },
  anchors_square: { set: 'town', lighting: 'dusk', opts: {}, cam: (s) => ({ pos: P(s, 'square.table', [3.3, 1.0, 0.0]), look: P(s, 'square.table', [0, -0.35, 0]), fov: 50 }) },
  anchors_park: { set: 'town', lighting: 'day', opts: { partyProps: false }, cam: (s) => ({ pos: P(s, 'park.table', [-1.2, 1.3, 3.6]), look: P(s, 'park.table', [0, -0.1, 0]), fov: 44 }) },
  anchors_room: { set: 'room', lighting: 'day', opts: { window: 'day' }, cam: (s) => ({ pos: P(s, 'room.chair', [-1.6, 1.6, -1.2]), look: P(s, 'room.chair', [0, 0.8, 0.4]), fov: 50 }) },
};
const SHEET = ['overview_party', 'street', 'pool', 'foam', 'square_dusk', 'quiet_street', 'park_day', 'room_night', 'room_marcus', 'room_grandad', 'stage', 'banner'];

// ── anchor test boxes (2 units tall, nose = +Z)
const markers = new THREE.Group();
const boxGeo = new THREE.BoxGeometry(0.42, 2.0, 0.26).translate(0, 1.0, 0);
const noseGeo = new THREE.ConeGeometry(0.09, 0.32, 8).rotateX(Math.PI / 2).translate(0, 1.45, 0.3);
const boxMat = new THREE.MeshStandardMaterial({ color: '#ff3b30', roughness: 0.6, transparent: true, opacity: 0.72 });
const noseMat = new THREE.MeshStandardMaterial({ color: '#ffe14a', roughness: 0.6 });
function addMarkers(s) {
  for (const name of ['square.chairA', 'square.chairB', 'room.chair', 'park.stool1', 'park.stool2', 'room.center']) {
    const a = s.anchors[name]; if (!a) continue;
    const g = new THREE.Group();
    g.add(new THREE.Mesh(boxGeo, boxMat), new THREE.Mesh(noseGeo, noseMat));
    a.updateWorldMatrix(true, false);
    a.matrixWorld.decompose(g.position, g.quaternion, g.scale);
    s.root.add(g);
  }
}
let charMod = null;
async function addChars(s) {
  try { charMod ??= await import('/src/characters.js'); } catch (e) { console.warn('characters.js failed', e.message); return; }
  const specs = {
    me: { skin: '#f1c7a1', hair: { style: 'fade', color: '#2b1d14' }, top: { style: 'hoodie', color: '#1d1d22', accent: '#ffffff', emblem: 'knight' }, bottom: { style: 'pants', color: '#55575e' }, accessories: ['headphones'] },
    mayor: { skin: '#f0c09a', hair: { style: 'short', color: '#9a9590' }, top: { style: 'suit', color: '#7a1f2b', accent: '#ffd23f' }, accessories: ['topHat', 'sash', 'mustache'], build: 1.2, scale: 1.05 },
  };
  for (const [name, who] of [['square.chairA', 'me'], ['square.chairB', 'mayor'], ['room.chair', 'me'], ['park.stool1', 'me']]) {
    const a = s.anchors[name]; if (!a) continue;
    const ch = charMod.makeCharacter(specs[who]);
    a.updateWorldMatrix(true, false); a.matrixWorld.decompose(ch.root.position, ch.root.quaternion, ch.root.scale);
    ch.pose('sitIdle', 0.4, { hands: 'table' }); ch.face('determined', 0.4);
    s.root.add(ch.root);
  }
}

function applyView(v) {
  const s = getSet(v.set);
  for (const c of [...scene.children]) if (c !== camera) scene.remove(c);
  scene.add(s.root);
  if (s.anchors.houses) for (const [k, val] of Object.entries(TOWN_DEFAULT)) if (s.options[k] !== val) s.set(k, val);
  s.setLighting(v.lighting);
  for (const [k, val] of Object.entries(v.opts || {})) s.set(k, val);
  s.update(T);
  scene.background = s.background; scene.fog = s.fog;
  const c = v.cam(s);
  camera.position.copy(c.pos); camera.lookAt(c.look); camera.fov = c.fov; camera.updateProjectionMatrix();
  return s;
}
const stats = document.getElementById('stats');
function label(text, x, y) { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; document.body.appendChild(d); }

async function main() {
  if (SHOW_ANCHORS) { addMarkers(getSet('town')); addMarkers(getSet('room')); }
  if (CHARS) { await addChars(getSet('town')); await addChars(getSet('room')); }
  if (VIEW) {
    const v = VIEWS[VIEW];
    if (!v) throw new Error('unknown view ' + VIEW + ' — known: ' + Object.keys(VIEWS).join(', '));
    const s = applyView(v);
    // perf experiments (&exp=a,b): noshadow nosky lights1 basic notransp noaa
    if (EXP.includes('noshadow')) renderer.shadowMap.enabled = false;
    if (EXP.includes('nosky')) s.root.traverse((o) => { if (o.name === 'sky' || o.name === 'stars') o.visible = false; });
    if (EXP.includes('lights1')) s.root.traverse((o) => { if (o.isLight && !o.isHemisphereLight && o.name !== 'key' && !(o.isDirectionalLight && o.castShadow)) o.visible = false; });
    if (EXP.includes('notransp')) s.root.traverse((o) => { if (o.material && o.material.transparent) o.visible = false; });
    if (EXP.includes('aniso1')) s.root.traverse((o) => { for (const m of [].concat(o.material || [])) for (const k of ['map', 'emissiveMap']) if (m[k]) { m[k].anisotropy = 1; m[k].needsUpdate = true; } });
    if (EXP.includes('nomaps')) s.root.traverse((o) => { for (const m of [].concat(o.material || [])) if (m.map && m.isMeshStandardMaterial) { m.map = null; m.needsUpdate = true; } });
    if (EXP.includes('basic')) scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: '#888888' });
    if (EXP.includes('lambert')) s.root.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial) { const m = o.material; o.material = new THREE.MeshLambertMaterial({ color: m.color, map: m.map, vertexColors: m.vertexColors, emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, flatShading: m.flatShading }); } });
    renderer.render(scene, camera);
    const info = `${VIEW}  calls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k  progs ${renderer.info.programs.length}`;
    if (Q.get('ab')) {   // interleaved A/B variants, medians: &ab=1&n=5
      renderer.setSize(720, 1280);
      const gl = renderer.getContext(), px = new Uint8Array(4);
      const lights = []; s.root.traverse((o) => { if (o.isLight) lights.push(o); });
      const stdMeshes = []; s.root.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial) stdMeshes.push([o, o.material]); });
      const lamb = new Map();
      const toLambert = (on) => { for (const [o, m] of stdMeshes) { if (on) { if (!lamb.has(m)) lamb.set(m, new THREE.MeshLambertMaterial({ color: m.color, map: m.map, vertexColors: m.vertexColors, emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, flatShading: m.flatShading, side: m.side })); o.material = lamb.get(m); } else o.material = m; } };
      const reset = () => { s.root.traverse((o) => { if (o.userData._rs !== undefined) o.receiveShadow = o.userData._rs; }); renderer.shadowMap.enabled = true; lights.forEach((l) => (l.visible = true)); toLambert(false); scene.overrideMaterial = null; renderer.shadowMap.needsUpdate = true; };
      const variants = {
        base: () => {},
        twoLights: () => lights.forEach((l) => { l.visible = l.isHemisphereLight || l.castShadow; }),
        noShadow: () => { renderer.shadowMap.enabled = false; },
        lambert: () => toLambert(true),
        lambert2L: () => { toLambert(true); lights.forEach((l) => { l.visible = l.isHemisphereLight || l.castShadow; }); },
        basic: () => { scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: '#888' }); },
        noMaps: () => { for (const [o, m] of stdMeshes) { if (m.map) { if (!lamb.has('nm' + m.uuid)) { const c = m.clone(); c.map = null; c.emissiveMap = null; lamb.set('nm' + m.uuid, c); } o.material = lamb.get('nm' + m.uuid); } } },
        aniso1: () => { for (const [o, m] of stdMeshes) { if (m.map) { if (!lamb.has('a1' + m.uuid)) { const c = m.clone(); c.map = m.map.clone(); c.map.anisotropy = 1; c.map.needsUpdate = true; lamb.set('a1' + m.uuid, c); } o.material = lamb.get('a1' + m.uuid); } } },
        noRecv: () => { s.root.traverse((o) => { if (o.isMesh || o.isInstancedMesh) { o.userData._rs ??= o.receiveShadow; o.receiveShadow = false; } }); },
      };
      const res = {}; for (const k in variants) res[k] = [];
      const n = +(Q.get('n') || 4);
      for (let i = -1; i < n; i++) for (const [k, f] of Object.entries(variants)) {
        reset(); f(); s.root.traverse((o) => { if (o.material && !Array.isArray(o.material)) o.material.needsUpdate = true; });
        renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);   // warm (compile)
        const t0 = performance.now(); s.update(T + i / 30); renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        if (i >= 0) res[k].push(performance.now() - t0);
      }
      const med = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1].toFixed(0);
      console.log(`BENCH AB ${VIEW} 720x1280: ` + Object.entries(res).map(([k, a]) => `${k} ${med(a)}`).join(' | '));
      reset();
      renderer.setSize(W, H);
    }
    if (BENCH) {
      renderer.setSize(720, 1280);
      renderer.render(scene, camera);
      const t0 = performance.now();
      const gl = renderer.getContext(), px = new Uint8Array(4);
      for (let i = 0; i < BENCH; i++) { s.update(T + i / 30); renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
      const ms = (performance.now() - t0) / BENCH;
      console.log(`BENCH ${VIEW} 720x1280: ${ms.toFixed(1)} ms/frame, calls ${renderer.info.render.calls}, tris ${renderer.info.render.triangles}`);
      stats.textContent = `${info}\nbench 720x1280: ${ms.toFixed(1)} ms/frame`;
      renderer.setSize(W, H); renderer.render(scene, camera);
    } else stats.textContent = info + (s.info ? '\n' + JSON.stringify(s.info) : '');
    console.log(info);
  } else {
    const list = Q.get('sheet') === 'all' ? Object.keys(VIEWS) : SHEET;
    const cols = list.length > 12 ? 5 : 4, rows = Math.ceil(list.length / cols);
    const cw = Math.floor(W / cols), chh = Math.floor(H / rows);
    renderer.setScissorTest(true);
    renderer.setClearColor('#111318'); renderer.clear();
    list.forEach((name, i) => {
      const v = VIEWS[name];
      const cx = (i % cols) * cw, cy = Math.floor(i / cols) * chh;
      // keep 9:16 inside each cell
      let w = cw - 4, h = Math.round(w * 16 / 9);
      if (h > chh - 4) { h = chh - 4; w = Math.round(h * 9 / 16); }
      const x = cx + Math.round((cw - w) / 2), y = cy + Math.round((chh - h) / 2);
      applyView(v);
      renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h);
      renderer.render(scene, camera);
      label(name, x + 2, y + 2);
    });
    renderer.setScissorTest(false);
  }
  requestAnimationFrame(() => { window.__ready = true; });
}
main().catch((e) => { console.error(e); stats.textContent = 'ERROR: ' + e.message; window.__ready = true; });
</script>
</body>
</html>
